/* ---------- State ---------- */
/* Remise a zero unique de la langue enregistree — meme cle et meme valeur que
   js/i18n.js et outils/tools.js. Cette page ne charge pas js/i18n.js, d'ou la
   duplication. Voir le commentaire detaille dans js/i18n.js. */
const LANG_RESET = '2026-08-en';
try {
  if(localStorage.getItem('vs_lang_reset') !== LANG_RESET){
    localStorage.removeItem('vs_site_lang');
    localStorage.setItem('vs_lang_reset', LANG_RESET);
  }
} catch(e){}

/* Langue par défaut : ANGLAIS (aligné sur js/i18n.js). */
function detectLang(){
  try{ const v = localStorage.getItem('vs_site_lang'); if(v && TR[v]) return v; }catch(e){}
  return 'en';
}
const state = {
  lang: detectLang(),
  view: 'wizard', // wizard | loading | results
  step: 1,
  inputMethod: null,
  storyInput: '',
  isProcessing: false,
  error: null,
  styleCategory: 'animation',
  config: { sceneCount:5, style:'disney', customStyle:'', aspectRatio:'16:9', customWidth:'', customHeight:'', tone:'adventure', ageGroup:'all ages', visualRichness:'cinematic', useCharacterRefs:false },
  maxScenes: 20,
  userPlan: null,
  result: null,
  isGenerating: false,
  generationError: null,
  loadingMsgIdx: 0,
  loadingTimer: null,
  activeTab: 'summary',
  copiedId: null,
  showSequential: {}
};
function t(key){ return (TR[state.lang] && TR[state.lang][key]) || TR.en[key] || key; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function icons(){ if(window.lucide) lucide.createIcons(); }

/* ---------- Auth helper ---------- */
async function getToken(){
  try{ const s = await window.Auth?.getSession?.(); return s?.access_token || null; }catch(e){ return null; }
}

/* ---------- Nav ---------- */
function renderNav(){
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = state.lang;
  const nav = document.getElementById('topNav');
  nav.innerHTML = `
    <div class="flex flex-col pointer-events-auto cursor-pointer" onclick="location.href='/dashboard.html'">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-purple-600 flex items-center justify-center shadow-lg">
          <i data-lucide="film" class="w-6 h-6 text-white"></i>
        </div>
        <span class="text-xl font-bold tracking-tighter hidden sm:block">VidSpark <span class="text-cyan-400">AI</span></span>
      </div>
    </div>
    <div class="flex items-center gap-4 pointer-events-auto">
      <div class="flex items-center bg-white/5 rounded-lg p-1">
        ${['fr','en','ar'].map(l=>`<button onclick="setLang('${l}')" class="px-3 py-1 text-xs font-bold rounded-md transition-all ${state.lang===l?'bg-cyan-500 text-white shadow-lg':'text-white/40 hover:text-white hover:bg-white/5'}">${l.toUpperCase()}</button>`).join('')}
      </div>
      <button onclick="location.href='/dashboard.html'" class="inline-flex items-center justify-center rounded-full font-medium transition-all text-white/70 hover:text-white hover:bg-white/5 px-4 py-2 text-sm">${t('exitStudio')}</button>
      <div class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center">
        <i data-lucide="user" class="w-5 h-5 text-white/50"></i>
      </div>
    </div>`;
}
function setLang(l){ state.lang = l; try{ localStorage.setItem('vs_site_lang', l); }catch(e){} render(); }

/* ---------- Dispatcher ---------- */
function render(){
  renderNav();
  const app = document.getElementById('app');
  if(state.view === 'loading'){ app.innerHTML = renderLoading(); }
  else if(state.view === 'results' && state.result){ app.innerHTML = renderResults(); }
  else { app.innerHTML = renderWizard(); }
  icons();
  wireDynamicInputs();
}

/* ---------- STEP 1-4 wizard ---------- */
function progressBar(){
  let html = '<div class="flex items-center justify-between mb-12 px-4">';
  for(let i=1;i<=4;i++){
    html += `<div class="flex items-center flex-1 last:flex-none">
      <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all ${state.step>=i?'bg-cyan-500 text-black shadow-[0_0_15px_rgba(6,182,212,0.5)]':'bg-white/10 text-white/40'}">${i}</div>
      ${i<4?`<div class="h-1 flex-1 mx-4 rounded-full transition-all ${state.step>i?'bg-cyan-500':'bg-white/10'}"></div>`:''}
    </div>`;
  }
  return html + '</div>';
}

function renderWizard(){
  return `<div class="mx-auto px-6 py-12 transition-all duration-300 ${state.step===3?'max-w-7xl':'max-w-4xl'}">
    ${progressBar()}
    <div class="fade-in">${
      state.step===1 ? renderStep1() : state.step===2 ? renderStep2() : state.step===3 ? renderStep3() : renderStep4()
    }</div>
  </div>`;
}

function renderStep1(){
  const methods = [
    { id:'idea', icon:'wand-2', title:t('methodIdea'), desc:t('methodIdeaDesc') },
    { id:'upload', icon:'file-text', title:t('methodUpload'), desc:t('methodUploadDesc') },
    { id:'pdf', icon:'upload', title:t('methodPdf'), desc:t('methodPdfDesc') }
  ];
  let html = `<div class="text-center mb-12">
      <h2 class="text-4xl font-bold mb-4">${t('step1Title')}</h2>
      <p class="text-white/50">${t('step1Desc')}</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      ${methods.map(m=>`
        <button onclick="pickMethod('${m.id}')" class="p-8 rounded-3xl border transition-all text-start group ${state.inputMethod===m.id?'bg-cyan-500/10 border-cyan-500 shadow-[0_0_30px_rgba(6,182,212,0.1)]':'bg-white/5 border-white/10 hover:bg-white/10'}">
          <div class="w-12 h-12 rounded-2xl flex items-center justify-center mb-6 transition-transform group-hover:scale-110 ${state.inputMethod===m.id?'bg-cyan-500 text-black':'bg-white/10 text-cyan-400'}">
            <i data-lucide="${m.icon}" class="w-6 h-6"></i>
          </div>
          <h3 class="text-xl font-bold mb-2">${m.title}</h3>
          <p class="text-white/50 text-sm leading-relaxed">${m.desc}</p>
        </button>`).join('')}
    </div>`;

  if(state.inputMethod==='idea'){
    const demos = DEMO_STORIES[state.lang] || DEMO_STORIES.en;
    html += `<div class="space-y-6 mt-8 fade-in">
      ${state.error?`<div class="p-4 rounded-xl bg-red-500/10 border border-red-500/50 text-red-400 text-sm flex items-center justify-between"><span>${esc(state.error)}</span><button onclick="state.error=null;render();"><i data-lucide="x" class="w-4 h-4"></i></button></div>`:''}
      <textarea id="ideaInput" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-white/30 focus:border-cyan-500/50 focus:outline-none focus:ring-1 focus:ring-cyan-500/50 transition-all min-h-[200px] text-lg" placeholder="${t('placeholderIdea')}">${esc(state.storyInput)}</textarea>
      <div class="space-y-3">
        <label class="block text-sm font-medium text-white/70 mb-2 ml-1">${t('tryDemo')}</label>
        <div class="flex flex-wrap gap-2">
          ${demos.map((d,i)=>`<button onclick="useDemo(${i})" class="px-4 py-2 rounded-full bg-white/5 border border-white/10 text-xs text-white/60 hover:bg-white/10 hover:text-white transition-all">${esc(d.title)}</button>`).join('')}
        </div>
      </div>
      <div class="flex justify-end pt-4">
        <button onclick="expandIdea()" ${state.isProcessing?'disabled':''} class="inline-flex items-center justify-center rounded-full font-medium transition-all active:scale-95 disabled:opacity-50 disabled:pointer-events-none bg-cyan-500 text-black hover:bg-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.5)] px-8 py-4 text-lg font-bold gap-2">
          <i data-lucide="${state.isProcessing?'loader-2':'sparkles'}" class="w-5 h-5 ${state.isProcessing?'animate-spin':''}"></i> ${t('expandBtn')}
        </button>
      </div>
    </div>`;
  } else if(state.inputMethod==='upload' || state.inputMethod==='pdf'){
    html += `<div class="mt-8 fade-in">
      ${state.error?`<div class="p-4 rounded-xl bg-red-500/10 border border-red-500/50 text-red-400 text-sm mb-6">${esc(state.error)}</div>`:''}
      <div onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-white/10 rounded-3xl p-12 text-center hover:border-cyan-500/50 transition-all cursor-pointer bg-white/5">
        <input type="file" id="fileInput" class="hidden" accept="${state.inputMethod==='pdf'?'.pdf':'.txt,.doc,.docx'}" onchange="handleFileUpload(event)">
        <div class="w-16 h-16 rounded-full bg-cyan-500/10 flex items-center justify-center mx-auto mb-6">
          <i data-lucide="${state.isProcessing?'loader-2':'upload'}" class="w-8 h-8 text-cyan-400 ${state.isProcessing?'animate-spin':''}"></i>
        </div>
        <h3 class="text-xl font-bold mb-2">${state.inputMethod==='pdf'?t('uploadPdfBtn'):t('uploadBtn')}</h3>
        <p class="text-white/40">${t('dragDrop')}</p>
      </div>
    </div>`;
  }
  return html;
}

function renderStep2(){
  return `<div class="text-center mb-8">
      <h2 class="text-4xl font-bold mb-4">${t('step2Title')}</h2>
      <p class="text-white/50">${t('step2Desc')}</p>

async function expandIdea(){
  const val = (document.getElementById('ideaInput')?.value || state.storyInput || '').trim();
  if(!val) return;
  state.isProcessing = true; state.error = null; render();
  try{
    const token = await getToken();

    const res = await fetch(API_BASE+'/api/story/expand', { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`}, body:JSON.stringify({ idea: val, language: state.lang }) });
    if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.error || t('expandError')); }
    const data = await res.json();

    state.step = 2;
  }catch(err){ state.error = err.message || t('expandError'); }
  finally{ state.isProcessing = false; render(); }
}

async function summarizeIfNeeded(text){
  if(text.length <= 12000) return text;
  const token = await getToken();
  if(!token) return text;
  try{
    const res = await fetch(API_BASE+'/api/story/summarize', { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`}, body:JSON.stringify({ text, language: state.lang }) });
    if(!res.ok) return text.slice(0,12000);
    const data = await res.json();
    return data.text || text.slice(0,12000);
  }catch(e){ return text.slice(0,12000); }
}

async function handleFileUpload(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  state.isProcessing = true; state.error = null; render();
  try{
    let text = '';
    if(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')){
      text = await extractTextFromPDF(file);
      text = await summarizeIfNeeded(text);
    } else if(file.name.toLowerCase().endsWith('.docx')){
      await ensureMammoth();
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer });
      text = await summarizeIfNeeded(result.value);
    } else if(file.name.toLowerCase().endsWith('.doc')){
      throw new Error(state.lang==='ar' ? 'عذراً، صيغة .doc غير مدعومة. يرجى تحويل الملف إلى .docx أو .txt.' : (state.lang==='fr' ? 'Format .doc non supporté. Convertissez en .docx ou .txt.' : '.doc format is not supported. Please convert to .docx or .txt.'));
    } else {
      const buf = await file.arrayBuffer();
      try{ text = new TextDecoder('utf-8',{fatal:true}).decode(buf); }
      catch(e){ text = new TextDecoder('windows-1256').decode(buf); }
      text = await summarizeIfNeeded(text);
    }
    state.storyInput = text;
    state.step = 2;
  }catch(err){ state.error = err.message || t('uploadError'); }
  finally{ state.isProcessing = false; render(); }
}

let _pdfjsReady = null;
function ensurePdfJs(){
  if(_pdfjsReady) return _pdfjsReady;
  _pdfjsReady = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js';
    s.onload = ()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; resolve(); };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return _pdfjsReady;
}
let _mammothReady = null;
function ensureMammoth(){
  if(_mammothReady) return _mammothReady;
  _mammothReady = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
  return _mammothReady;
}
async function extractTextFromPDF(file){
  await ensurePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  let full = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    full += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return full;
}

function styleForPrompt(){
  const s = ANIMATION_STYLES.find(x=>x.id===state.config.style);
  return s ? `${s.name} (${s.description})` : state.config.style;
}
async function doGenerate(){
  const c = state.config;
  const aspectRatio = (c.customWidth && c.customHeight) ? `${c.customWidth}x${c.customHeight}` : c.aspectRatio;
  const token = await getToken();
  if(!token){ state.view='wizard'; state.error = t('authRequired'); render(); return; }
  state.view = 'loading'; state.isGenerating = true; state.generationError = null; state.loadingMsgIdx = 0;
  render();
  clearInterval(state.loadingTimer);
  state.loadingTimer = setInterval(()=>{ state.loadingMsgIdx = (state.loadingMsgIdx+1) % LOADING_MESSAGES[state.lang].length; renderLoadingMsgOnly(); }, 3000);
  try{
    const res = await fetch(API_BASE+'/api/story/generate', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body: JSON.stringify({
        storyInput: state.storyInput,
        language: state.lang,
        config: { sceneCount:c.sceneCount, style: styleForPrompt(), customStyle:c.customStyle, aspectRatio, tone:c.tone, ageGroup:c.ageGroup, visualRichness:c.visualRichness }
      })
    });
    if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.error || t('genError')); }
    const { jobId } = await res.json();
    const data = await pollStoryJob(jobId, token);
    state.result = data; state.activeTab = 'summary'; state.view = 'results';
  }catch(err){ state.generationError = err.message || t('genError'); }
  finally{ state.isGenerating = false; clearInterval(state.loadingTimer); render(); }
}

/* Une histoire complète peut prendre plus longtemps qu'une seule requête HTTP ne le
   permet de façon fiable (timeout Railway/navigateur observé en prod) : /generate
   répond immédiatement avec un jobId, on sonde /status/:jobId jusqu'à ce que ce soit prêt. */
async function pollStoryJob(jobId, token){
  const start = Date.now();
  const maxWaitMs = 8 * 60 * 1000;
  while (Date.now() - start < maxWaitMs){
    await new Promise(r=>setTimeout(r, 4000));
    const res = await fetch(API_BASE+'/api/story/status/'+jobId, { headers:{ 'Authorization':`Bearer ${token}` } });
    if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.error || t('genError')); }
    const job = await res.json();
    if(job.status === 'done') return job.result;
    if(job.status === 'error') throw new Error(job.error || t('genError'));
  }
  throw new Error(t('genError'));
}

function getFullPrompt(p){
  if(!p) return '';
  const hint = "You are a professional image generator. Do not change the character's identity, face, outfit, or colors. Strictly follow the prompt instructions. ";
  if(/professional image generator|character reference images/i.test(p)) return p;
  return hint + p;
}
function getFullNegativePrompt(p){
  if(!p) return '';
  const clause = "Do not generate multiple images of a character in one single image, do not split the image into multiple images.";
  if(/multiple images of a character|split the image into multiple images/i.test(p)) return p;
  const trimmed = p.trim();
  return /[.,]$/.test(trimmed) ? `${trimmed} ${clause}` : `${trimmed}, ${clause}`;
}
function getEmptyScenePrompt(scene){
  if(scene.emptyScenePrompt) return scene.emptyScenePrompt;
  const hint = "You are a professional image generator. Do not change the character's identity, face, outfit, or colors. Strictly follow the prompt instructions. ";
  const base = (scene.prompt||'').replace(hint,'');
  const pre = state.lang==='ar' ? 'نموذج فارغ للبيئة والخلفية متطابق الأبعاد والأسلوب وبدون أشخاص:' : (state.lang==='fr' ? "Arrière-plan vide, décor identique, sans aucun personnage :" : 'Empty background establishing shot, flawless scenery backdrop, with absolutely no characters, no human figures, no silhouettes, and no people:');
  return `${pre} ${base}`;
}
function handleDownloadJSON(){
  const r = state.result;
  const synced = { ...r, scenes: r.scenes.map(s=>({ ...s, prompt:getFullPrompt(s.prompt), negativePrompt:getFullNegativePrompt(s.negativePrompt) })) };
  downloadFile(JSON.stringify(synced,null,2), 'vidspark-story-pack.json', 'application/json');
}
function handleDownloadTXT(){
  const r = state.result;
  let txt = `# ${r.title}\n\n## Synopsis\n${r.synopsis}\n\n## Story\n${r.condensedStory||''}\n\n## Characters\n`;
  (r.characters||[]).forEach(c=>{ txt += `\n### ${c.name} (${c.role})\nPrompt: ${c.prompt}\n`; if(c.negativePrompt) txt += `Negative Prompt: ${c.negativePrompt}\n`; });
  txt += `\n## Scenes\n`;
  (r.scenes||[]).forEach(s=>{
    txt += `\n### Scene ${s.number}: ${s.title}\nPrompt: ${getFullPrompt(s.prompt)}\nVideo Prompt: ${s.videoPrompt||''}\n`;
    if(s.sequentialVideoPrompt) txt += `Sequential Video Prompt: ${s.sequentialVideoPrompt}\n`;
    if(s.dialogue) txt += `Dialogue:\n${s.dialogue}\n`;
    txt += `Continuity: ${s.continuityNotes||''}\n`;
    if(s.negativePrompt) txt += `Negative Prompt: ${getFullNegativePrompt(s.negativePrompt)}\n`;
  });
  downloadFile(txt, 'vidspark-story-pack.txt', 'text/plain');
}
function handleCopyAll(){
  const txt = (state.result.scenes||[]).map(s=>`Scene ${s.number}: ${getFullPrompt(s.prompt)}`).join('\n\n');

}

/* ---------- Boot ---------- */
(async function boot(){
  render();
  try{
    const token = await getToken();
    if(!token){
      state.error = t('authRequired');
      render();
      return;
    }
    const res = await fetch(API_BASE+'/api/user/quota', { headers:{ 'Authorization':`Bearer ${token}` } });
    if(res.ok){
      const q = await res.json();
      state.userPlan = q.plan;
      state.maxScenes = (q.plan === 'free' || !q.plan) ? 10 : 20;
      state.config.sceneCount = Math.min(state.maxScenes, state.config.sceneCount);
      render();
    }
  }catch(e){}
})();
</script>
  <script defer src="/js/support-chat.js"></script>
