  body .tp-main{ --orange:#6D5EF2; --orange-d:#4C3FCB; --purple:#22C1C3; }
  body .tp-main .chip{ background:rgba(109,94,242,.12); border-color:rgba(109,94,242,.3); }
  body .tp-main .tp-panel::before{
    background:linear-gradient(90deg,#4C3FCB,#6D5EF2,#22C1C3,#6D5EF2,#4C3FCB);
    background-size:300% 100%; animation:sgShimmer 10s ease infinite;
  }
  @keyframes sgShimmer{ 0%{background-position:0% 50%;} 100%{background-position:300% 50%;} }
  .tp-head{ animation:sgFadeUp .5s ease both; }
  .tp-panel{ animation:sgFadeUp .5s ease both .08s; }
  .tp-side .tp-card{ animation:sgFadeUp .5s ease both; }
  .tp-side .tp-card:nth-child(1){ animation-delay:.14s; }
  .tp-side .tp-card:nth-child(2){ animation-delay:.20s; }
  .tp-side .tp-card:nth-child(3){ animation-delay:.26s; }
  .tp-side .tp-card:nth-child(4){ animation-delay:.32s; }
  @keyframes sgFadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    .tp-head, .tp-panel, .tp-side .tp-card{ animation:none; }
    body .tp-main .tp-panel::before{ animation:none; }
  }

  .sg-toggle{ display:flex; gap:8px; }
  .sg-toggle button{ flex:1; padding:9px; border-radius:10px; border:1px solid var(--b2); background:var(--s2); color:var(--muted); font-size:12px; font-weight:700; cursor:pointer; }

  .sg-scene-card{ background:var(--s2); border:1px solid var(--b2); border-radius:12px; padding:14px; margin-bottom:12px; }
  .sg-scene-card h4{ font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .sg-field .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:3px; display:flex; align-items:center; justify-content:space-between; gap:6px; }

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function copy(txt,btn){navigator.clipboard.writeText(txt).then(()=>{const orig=btn.textContent;btn.textContent='✓ '+t('sg_copied');setTimeout(()=>btn.textContent=orig,1400);});}

function renderTools(){
  document.getElementById('tools').innerHTML = Object.keys(TOOLS)
    .map(k=>`<button class="tool ${k===current?'active':''}" onclick="selectTool('${k}')">${TAB_META[k].icon} ${t(TAB_META[k].key)}</button>`).join('');
}

      <div class="tp-form-fields"><label>${t('sg_tab_summarize')}</label><textarea id="f_text" style="min-height:140px;" placeholder="${t('sg_summarizeph')}"></textarea></div>
      <div class="tp-divider"></div>
      <div class="tp-form-fields"><label>${t('sg_lang_label')||'Langue'}</label>${langSelectHtml()}</div>`;
  }
}
function langSelectHtml(){
  return `<select id="f_lang">
    <option value="fr">Français</option><option value="en">English</option>
    <option value="es">Español</option><option value="ar">العربية</option>
    <option value="pt">Português</option><option value="de">Deutsch</option>
    <option value="it">Italiano</option><option value="ru">Русский</option>
    <option value="ja">日本語</option><option value="ko">한국어</option>
    <option value="hi">हिन्दी</option><option value="zh">中文</option>
    <option value="tr">Türkçe</option><option value="nl">Nederlands</option>
  </select>`;
}
function pickRichness(btn){
  document.querySelectorAll('.sg-toggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  config.visualRichness = btn.dataset.v;
}
function selectTool(k){ current=k; document.getElementById('out').innerHTML=emptyStateHTML(k); renderTools(); renderForm(); syncSidebar(); }

function syncSidebar(){
  if(!window.shell) return;
  const toolDef = TOOLS[current];
  shell.updateCard('tips', `<p>💡 ${t(toolDef.tipKey)}</p>`);
  shell.updateCard('outcome', `<div class="tag-wrap">${(toolDef.outcomes||[]).map(ok=>`<span class="tag">${t(ok)}</span>`).join('')}</div>`);
}
function emptyStateHTML(k){
  const meta = TAB_META[k];
  return `<div class="tp-out-empty">
    <div class="ic">${meta.icon}</div>
    <div class="tt">${t('sg_empty_title')}</div>
    <div class="list">${(TOOLS[k].outcomes||[]).map(ok=>`<span class="badge">${t(ok)}</span>`).join('')}</div>
  </div>`;
}
function bumpSessionStats(){
  const n = (parseInt(sessionStorage.getItem('vs_story_gens')||'0',10) || 0) + 1;
  sessionStorage.setItem('vs_story_gens', String(n));
  if(window.shell) shell.updateCard('stats', `<div class="tp-stat-row"><span class="lb">${t('sg_session_count')||'Générations cette session'}</span><span class="vl">${n}</span></div>`);
}

window.shell = ToolPage.mount({
  icon:'🎬', title:'Générateur d’histoires',
  subtitle:t('sg_subtitle'),
  meta:[
    { icon:'🤖', text:t('sg_ai') },
    { icon:'⚡', text:Object.keys(TOOLS).length+' '+t('sg_tools_word') },
    { icon:'🎨', text:STYLE_LIST.length+' '+t('sg_styles_word') }
  ],
  sidebar:[
    { id:'tips', icon:'💡', title:t('sg_sc_tips'), html:`<p>💡 ${t(TOOLS[current].tipKey)}</p>` },
    { id:'outcome', icon:'📦', title:t('sg_sc_outcome'), html:`<div class="tag-wrap">${(TOOLS[current].outcomes||[]).map(ok=>`<span class="tag">${t(ok)}</span>`).join('')}</div>` },
    { id:'stats', icon:'📊', title:'', html:`<div class="tp-stat-row"><span class="lb">${t('sg_session_count')}</span><span class="vl">${parseInt(sessionStorage.getItem('vs_story_gens')||'0',10)}</span></div>` },
    { id:'shortcuts', icon:'🔗', title:t('sg_sc_shortcuts'), html:`<ul>
        <li><a href="/dashboard.html">🏠 ${t('sg_shortcut_dashboard')} <span>›</span></a></li>
        <li><a href="/outils.html">🛠️ ${t('sg_shortcut_tools')} <span>›</span></a></li>
      </ul>` }
  ]
});
shell.main.innerHTML = `
  <div class="tp-panel">
    <nav class="tools" id="tools"></nav>
    <div class="tp-panel-body" id="form"></div>
  </div>
  <button class="btn" id="go" onclick="run()">✨ ${t('sg_generate')}</button>
  <div id="out"></div>`;
document.getElementById('out').innerHTML = emptyStateHTML(current);

(async function(){
  renderTools(); renderForm();
  try{
    const s = await (window.Auth?.getSession?.() || Promise.resolve(null));
    if(!s?.access_token){
      document.getElementById('out').innerHTML=`<div class="empty">🔒 ${t('sg_auth_required')}<br><br><a href="/login.html">${t('sg_login_link')} →</a></div>`;
      document.getElementById('go').disabled=true;
    }
  }catch(e){}
})();

async function run(){
  const out = document.getElementById('out'), btn = document.getElementById('go');
  const lang = document.getElementById('f_lang').value;
  let body, ep;
  if(current==='full'){
    ep = TOOLS.full.ep;
    const storyInput = (document.getElementById('f_story').value||'').trim();
    if(storyInput.length<10){ out.innerHTML=`<div class="err">${t('sg_storylabel')} (10+)</div>`; return; }
    body = {
      storyInput, language: lang,
      config: {
        sceneCount: parseInt(document.getElementById('f_sceneCount').value,10)||5,
        style: document.getElementById('f_style').value,
        customStyle: document.getElementById('f_customStyle').value.trim(),
        aspectRatio: document.getElementById('f_ratio').value,
        tone: document.getElementById('f_tone').value,
        ageGroup: document.getElementById('f_age').value,
        visualRichness: config.visualRichness
      }
    };
  } else if(current==='expand'){
    ep = TOOLS.expand.ep;
    const idea = (document.getElementById('f_idea').value||'').trim();
    if(idea.length<3){ out.innerHTML=`<div class="err">${t('sg_ideph')}</div>`; return; }
    body = { idea, language: lang };
  } else {
    ep = TOOLS.summarize.ep;
    const text = (document.getElementById('f_text').value||'').trim();
    if(text.length<20){ out.innerHTML=`<div class="err">${t('sg_summarizeph')}</div>`; return; }
    body = { text, language: lang };
  }

  btn.disabled=true; btn.innerHTML=`<span class="spin"></span> ${t('sg_generating')}`;
  out.innerHTML=`<div class="empty">🎬 ${t('sg_ai_working')}</div>`;
  try{
    const s = await Auth.getSession();
    const token = s?.access_token;
    if(!token){ out.innerHTML=`<div class="err">${t('sg_session_expired')} <a href="/login.html">${t('sg_reconnect')}</a>.</div>`; return; }
    const res = await fetch(API_BASE + ep, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body:JSON.stringify(body)
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||(t('sg_error_generic')+' '+res.status)); }
    const data = await res.json();
    RENDER[current](data, out);
    if(typeof fbq==='function') fbq('trackCustom','StoryToolUsed',{tool:current});
    bumpSessionStats();
  }catch(err){ out.innerHTML='<div class="err">❌ '+esc(err.message)+'</div>'; }
  finally{ btn.disabled=false; btn.innerHTML=`✨ ${t('sg_generate')}`; }
}

function fieldRow(label, value){
  if(!value) return '';
  return `<div class="sg-field"><div class="lbl">${esc(label)}<button class="btn-mini" onclick='copy(${JSON.stringify(String(value))},this)'>📋 ${t('sg_copy')}</button></div><div class="val">${esc(value)}</div></div>`;
}

const RENDER = {
  full(d,out){
    const chars = d.characters||[], scenes = d.scenes||[], cont = d.continuity||{};
    const head = `<div class="sec">
      <h3>🎬 ${esc(d.title||'')}</h3>
      ${d.hook?`<div class="cap" style="margin-top:8px;">🪝 ${esc(d.hook)}</div>`:''}
      ${d.synopsis?`<div class="muted" style="margin-top:8px;">${esc(d.synopsis)}</div>`:''}
    </div>`;
    const charsHtml = chars.length ? `<div class="sec"><h3>👤 ${t('sg_oc_characters')} (${chars.length})</h3>${chars.map(c=>`
      <div class="sg-char-card">
        <h4>${esc(c.name||'')} <span class="badge">${esc(c.role||'')}</span></h4>
        ${fieldRow('Prompt', c.prompt)}
        ${fieldRow('Negative prompt', c.negativePrompt)}
      </div>`).join('')}</div>` : '';
    const scenesHtml = scenes.length ? `<div class="sec"><h3>🎞️ ${t('sg_oc_scenes')} (${scenes.length})</h3>${scenes.map(s=>`
      <div class="sg-scene-card">
        <h4>#${s.number||''} ${esc(s.title||'')} <span class="badge">${esc(s.sceneCharacters||'')}</span></h4>
        ${s.purpose?`<div class="muted" style="font-size:12px;margin-bottom:8px;">🎯 ${esc(s.purpose)}</div>`:''}
        ${fieldRow('Prompt (image)', s.prompt)}
        ${fieldRow('Negative prompt', s.negativePrompt)}
        ${fieldRow('Video prompt', s.videoPrompt)}
        ${fieldRow('Sequential video prompt', s.sequentialVideoPrompt)}
        ${fieldRow('Dialogue', s.dialogue)}
        ${fieldRow('Empty scene prompt', s.emptyScenePrompt)}
        ${fieldRow('End frame prompt', s.endFramePrompt)}
        ${fieldRow('LTX transition end prompt', s.ltxTransitionEndPrompt)}
        ${fieldRow('Continuity notes', s.continuityNotes)}
        ${fieldRow('Transition continuity', s.transitionContinuity)}
        ${fieldRow('Camera', s.camera)}
        ${fieldRow('Character actions', s.characterActions)}
        ${fieldRow('Environment motion', s.environmentMotion)}
        ${fieldRow('Lighting', s.lighting)}
        ${fieldRow('Sound design', s.soundDesign)}
        ${fieldRow('Emotional atmosphere', s.emotionalAtmosphere)}
      </div>`).join('')}</div>` : '';
    const contHtml = (cont && Object.keys(cont).length) ? `<div class="sec"><h3>🔗 ${t('sg_oc_continuity')}</h3>
      <div class="sg-continuity">
        ${Object.entries(cont).map(([k,v])=>v?`<div class="lbl">${esc(k)}</div><div style="font-size:12.5px;">${esc(v)}</div>`:'').join('')}
      </div></div>` : '';
    out.innerHTML = `<div class="card">${head}${charsHtml}${scenesHtml}${contHtml}</div>`;
  },
  expand(d,out){
    const text = d.text || '';
    out.innerHTML = `<div class="card"><div class="sec"><div class="hd"><h3>💡 ${t('sg_oc_story')}</h3><button class="btn-mini" onclick='copy(${JSON.stringify(text)},this)'>📋 ${t('sg_copy')}</button></div>
      <div class="cap">${esc(text)}</div>
      <button class="btn" style="margin-top:12px;" onclick="sendToFull(${JSON.stringify(text)})">${t('sg_useinfull')}</button>
    </div></div>`;
  },
  summarize(d,out){
    const text = d.text || '';
    out.innerHTML = `<div class="card"><div class="sec"><div class="hd"><h3>📄 ${t('sg_oc_condensed')}</h3><button class="btn-mini" onclick='copy(${JSON.stringify(text)},this)'>📋 ${t('sg_copy')}</button></div>
      <div class="cap">${esc(text)}</div>
      <button class="btn" style="margin-top:12px;" onclick="sendToFull(${JSON.stringify(text)})">${t('sg_useinfull')}</button>
    </div></div>`;
  }
};

function sendToFull(text){
  selectTool('full');
  setTimeout(()=>{ const f=document.getElementById('f_story'); if(f) f.value = text; }, 30);
}
</script>
</body>
</html>
