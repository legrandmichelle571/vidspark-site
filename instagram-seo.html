function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function copy(txt,btn){navigator.clipboard.writeText(txt).then(()=>{const orig=btn.textContent;btn.textContent='✓ '+t('igs_copied');setTimeout(()=>btn.textContent=orig,1400);});}

function renderTools(){
  document.getElementById('tools').innerHTML = Object.keys(TOOLS)
    .map(k=>`<button class="tool ${k===current?'active':''}" onclick="selectTool('${k}')">${TAB_META[k].icon} ${t(TAB_META[k].key)}</button>`).join('');
}
function renderForm(){
  const toolDef = TOOLS[current];
  const inputs = toolDef.fields.map(([id,lbl,type])=>{
    const dispLbl = t(FIELD_LABEL_I18N[lbl]||lbl);
    const ph = dispLbl.replace(/\s*\*$/,'')+'…';
    if(type==='textarea') return `<label>${dispLbl}</label><textarea id="f_${id}" placeholder="${ph}"></textarea>`;
    return `<label>${dispLbl}</label><input id="f_${id}" placeholder="${ph}" maxlength="200">`;
  }).join('');
  document.getElementById('form').innerHTML = `
    <div class="tp-form-head">
      <div class="tp-form-title">⚙️ ${t('igs_params')}</div>
      <div class="tp-form-sub">${t('igs_form_sub')}</div>
    </div>
    <div class="tp-form-fields">${inputs}</div>
    <div class="tp-divider"></div>
    <div class="tp-form-fields">

      <select id="f_lang">
        <option value="fr">Français</option><option value="en">English</option>

        <option value="pt">Português</option><option value="de">Deutsch</option>

        <option value="ja">日本語</option><option value="ko">한국어</option>

        <option value="tr">Türkçe</option><option value="nl">Nederlands</option>
      </select>
    </div>`;
}

/* Exige une connexion */
(async function(){
  renderTools(); renderForm();
  try{
    const s = await (window.Auth?.getSession?.() || Promise.resolve(null));
    if(!s?.access_token){
      document.getElementById('out').innerHTML=`<div class="empty">🔒 ${t('igs_auth_required')}<br><br><a href="/login.html">${t('igs_login_link')} →</a></div>`;
      document.getElementById('go').disabled=true;
    }
  }catch(e){}
})();

async function run(){
  const toolDef = TOOLS[current];
  const out = document.getElementById('out'), btn = document.getElementById('go');
  const body = { language: document.getElementById('f_lang').value };
  toolDef.fields.forEach(([id])=>{ body[id] = (document.getElementById('f_'+id)?.value||'').trim(); });
  if(toolDef.tool) body.tool = toolDef.tool;

  const reqField = toolDef.fields.find(f=>f[1].includes('*'));
  if(reqField && (body[reqField[0]]||'').length<2){ out.innerHTML=`<div class="err">${t('igs_err_required')}</div>`; return; }

  btn.disabled=true; btn.innerHTML=`<span class="spin"></span> ${t('igs_generating')}`;
  out.innerHTML=`<div class="empty">📸 ${t('igs_ai_working')}</div>`;
  try{
    const s = await Auth.getSession();
    const token = s?.access_token;
    if(!token){ out.innerHTML=`<div class="err">${t('igs_session_expired')} <a href="/login.html">${t('igs_reconnect')}</a>.</div>`; return; }
    const res = await fetch(API_BASE + toolDef.ep, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body:JSON.stringify(body)
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||(t('igs_error_generic')+' '+res.status)); }
    const data = await res.json();
    RENDER[current](data, out);
    if(typeof fbq==='function') fbq('trackCustom','InstagramToolUsed',{tool:current});
    updatePreviewCard();
    bumpSessionStats();
  }catch(err){ out.innerHTML='<div class="err">❌ '+esc(err.message)+'</div>'; }
  finally{ btn.disabled=false; btn.innerHTML=`✨ ${t('igs_generate')}`; }
}

function chips(arr,cls){ return '<div class="chips">'+(arr||[]).map(h=>`<span class="chip ${cls||''}">${esc(h)}</span>`).join('')+'</div>'; }

const RENDER = {
  seo(d,out){
    const ht=d.hashtags||{}; const all=[].concat(ht.broad||[],ht.niche||[],ht.trending||[]).join(' ');
    out.innerHTML=`<div class="card">
      <div class="sec"><div class="hd"><h3>📝 ${t('igs_caption')}</h3><button class="btn-mini" onclick='copy(${JSON.stringify(d.caption||"")},this)'>📋 ${t('igs_copy')}</button></div><div class="cap">${esc(d.caption)}</div></div>
      <div class="sec"><h3>🪝 ${t('igs_hooks')}</h3>${(d.hooks||[]).map(h=>`<div class="item">${esc(h)}</div>`).join('')}</div>
      <div class="sec"><div class="hd"><h3># ${t('igs_hashtags')}</h3><button class="btn-mini" onclick='copy(${JSON.stringify(all)},this)'>📋 ${t('igs_copy_all')}</button></div>
        <div class="htcat"><div class="lbl">${t('igs_broad')}</div>${chips(ht.broad)}</div>
        <div class="htcat"><div class="lbl">${t('igs_niche_lbl')}</div>${chips(ht.niche)}</div>
        <div class="htcat"><div class="lbl">${t('igs_trending')}</div>${chips(ht.trending)}</div></div>
      <div class="sec"><h3>🔎 ${t('igs_keywords')}</h3>${chips(d.keywords,'k')}</div>
      <div class="sec"><h3>🎬 ${t('igs_script')}</h3>${(d.script||[]).map(s=>`<div class="step"><div class="p">${esc(s.part)}</div><div>${esc(s.content)}</div></div>`).join('')}</div>
      ${d.sound_advice?`<div class="sec"><h3>🎧 ${t('igs_sound')}</h3><div class="cap">${esc(d.sound_advice)}</div></div>`:''}
      <div class="sec"><h3>🚀 ${t('igs_tips_section')}</h3>${[].concat(d.posting_tips||[],d.discoverability_tips||[]).map(pt=>`<div class="item">${esc(pt)}</div>`).join('')}</div>
    </div>`;
  },
  repurpose(d,out){
    const clips=d.clips||[];
    const head = d.video?.title ? `<div class="muted" style="margin-bottom:12px;">🎬 ${esc(d.video.title)}${d.video.duration?` · ${esc(d.video.duration)}`:''}</div>` : '';
    // Repli sans transcription (YouTube bloque parfois sa récupération côté serveur, voir
    // instagram-repurpose côté backend) : pas de timecodes précis dans ce cas, on prévient.
    const notice = d.fallback ? `<div class="item" style="border-color:var(--orange-d);background:rgba(193,36,109,.06);margin-bottom:14px;">⚠️ ${esc(d.fallback_reason||'')}</div>` : '';
    out.innerHTML=`<div class="card">${head}${notice}${clips.map((c,i)=>{
      const time = (c.start && c.end) ? `<span class="chip p" style="font-size:13px;">✂️ ${esc(c.start)} → ${esc(c.end)}</span>` : '';
      return `
      <div class="sec">
        <h3>▶️ ${t('igs_clip')} ${i+1} ${time}</h3>
        <div class="item">
          <div class="muted" style="font-size:12px;">🎯 ${esc(c.angle||'')}</div>
          <b style="display:block;margin-top:4px;">🪝 ${esc(c.hook||'')}</b>
          ${c.script?`<div class="muted" style="font-size:12.5px;margin-top:6px;">🎬 ${esc(c.script)}</div>`:''}
          <div class="cap" style="margin-top:8px;">${esc(c.caption||'')}</div>${chips(c.hashtags,'p')}
          <button class="btn-mini" style="margin-top:8px;" onclick='copy(${JSON.stringify((c.caption||"")+" "+((c.hashtags||[]).join(" ")))},this)'>📋 ${t('igs_copy')}</button>
        </div>
      </div>`;
    }).join('')}</div>`;
  },
  ideas(d,out){
    out.innerHTML=`<div class="card"><div class="sec"><h3>🔥 ${t('igs_tab_ideas')}</h3>${(d.ideas||[]).map((it,i)=>`
      <div class="item"><span class="score">${it.viral_score||'—'}</span><b>${i+1}. ${esc(it.title||'')}</b>
        ${it.format?`<span class="badge">${esc(it.format)}</span>`:''}
        ${it.hook?`<div style="margin-top:4px;">🪝 ${esc(it.hook)}</div>`:''}
        ${it.why?`<div class="muted" style="font-size:12px;margin-top:2px;">✅ ${esc(it.why)}</div>`:''}</div>`).join('')}</div></div>`;
  },
  hooks(d,out){
    const best=d.best_index;
    out.innerHTML=`<div class="card"><div class="sec"><h3>🪝 ${t('igs_hooks_section_title')}</h3>${(d.hooks||[]).map((h,i)=>`
      <div class="item ${i===best?'best':''}"><span class="score">${h.score||'—'}</span>${i===best?'⭐ ':''}${esc(h.text||'')}
        ${h.type?`<div><span class="badge">${esc(h.type)}</span></div>`:''}</div>`).join('')}
      ${d.tip?`<div class="muted" style="margin-top:10px;">💡 ${esc(d.tip)}</div>`:''}</div></div>`;
  },
  calendar(d,out){
    out.innerHTML=`<div class="card"><div class="sec"><h3>📅 ${t('igs_oc_calendar')}</h3>${(d.schedule||[]).map(s=>`
      <div class="item"><b style="color:var(--purple)">${esc(s.day||'')}</b> ${s.best_time?`<span class="muted">· ${esc(s.best_time)}</span>`:''}
        <div style="margin-top:3px;">${esc(s.idea||'')}</div>
        ${s.format?`<span class="badge">${esc(s.format)}</span>`:''}
        ${s.hook?`<div style="margin-top:4px;">🪝 ${esc(s.hook)}</div>`:''}</div>`).join('')}</div></div>`;
  }
};
</script>
</body>
</html>
